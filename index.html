<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floating Timer</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="widget" data-tauri-drag-region>
      <div class="top-bar">
        <span id="dot" class="dot"></span>
        <button id="close" class="close" tabindex="-1" aria-label="Close">
          ×
        </button>
      </div>

      <div id="time" class="time">00:00:00</div>
      <div class="controls">
        <button id="toggle" data-state="idle" tabindex="-1">Start</button>
        <button id="reset" tabindex="-1">Reset</button>
      </div>
    </div>
  </body>
</html>
